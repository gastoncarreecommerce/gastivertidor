<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Gastivertidor V7 - Smart Balance</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root { --bg:#0f1220; --card:#171a2b; --muted:#8c91a5; --text:#e8ecff; --accent:#6ae3ff; }
  *{box-sizing:border-box}
  body{margin:0; font-family:system-ui,sans-serif; background:linear-gradient(180deg,#0a0d19,#0f1220); color:var(--text)}
  .wrap{max-width:1100px; margin:24px auto; padding:0 16px}
  .card{background:#171a2b; border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:20px}
  h1{font-size:22px; margin:0 0- 10px; color: var(--accent); display:flex; align-items:center; gap:10px}
  .grid{display:grid; gap:20px; grid-template-columns:1fr}
  @media(min-width:900px){.grid{grid-template-columns:1.2fr .8fr}}
  label{font-size:11px; color:var(--muted); display:block; margin-bottom:5px; text-transform: uppercase; font-weight: 700}
  input, select, textarea{width:100%; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,.1); background:#0d1020; color:var(--text)}
  .row{display:grid; grid-template-columns:repeat(12,1fr); gap:12px}
  .c6{grid-column:span 6} .c12{grid-column:span 12}
  .seg{display:flex; gap:10px; margin-bottom:15px}
  .seg button{border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,0.03); color:#8c91a5; border-radius:12px; padding:12px; cursor:pointer; flex:1}
  .seg button.active{background:var(--accent); color:#061018; font-weight:700}
  .btn{appearance:none; border:0; background:var(--accent); color:#061018; padding:16px; border-radius:12px; font-weight:800; cursor:pointer; width:100%; text-transform: uppercase}
  .log{height:150px; overflow:auto; background:#0d1020; border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px; font-family: monospace; font-size:11px; margin-top:15px}
  .drop-zone{border:2px dashed rgba(106, 227, 255, 0.2); border-radius:16px; padding:50px 20px; text-align:center; cursor:pointer}
  .pill{background:rgba(106, 227, 255, 0.1); color:var(--accent); padding:4px 10px; border-radius:6px; font-size:11px}
  .opt-box{background:rgba(255,255,255,0.03); padding:15px; border-radius:14px; border:1px solid rgba(255,255,255,0.05); margin-bottom: 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Gastivertidor <span class="pill">V7 SMART BALANCE</span></h1>
    
    <div class="seg">
      <button id="tabFiles" class="active">Archivos</button>
      <button id="tabUrls">URLs</button>
    </div>

    <div class="grid">
      <div id="paneFiles">
        <div class="drop-zone" id="dropZone">
          <p>Subí tus fotos de producto aquí</p>
          <span id="fileCount" class="pill">0 ARCHIVOS</span>
          <input type="file" id="localFiles" multiple accept="image/*" style="display:none" />
        </div>
      </div>

      <div id="paneUrls" style="display:none">
        <textarea id="urls" style="height:110px; margin-bottom:10px" placeholder="URLs..."></textarea>
        <div class="opt-box">
          <label style="display:flex; align-items:center; gap:8px; color:var(--accent); cursor:pointer">
            <input type="checkbox" id="vtexNaming" checked> <strong>Naming VTEX automático</strong>
          </label>
        </div>
      </div>

      <div>
        <div class="row">
          <div class="c6"><label>Ancho</label><input type="number" id="w" value="1024"></div>
          <div class="c6"><label>Alto</label><input type="number" id="h" value="1024"></div>
          
          <div class="c12">
            <div class="opt-box">
              <label style="display:flex; align-items:center; gap:8px; color:var(--accent); cursor:pointer">
                <input type="checkbox" id="smartBalance" checked> 
                <strong>Smart Balance (Auto-Centrado Óptico)</strong>
              </label>
              <p style="font-size:10px; color:var(--muted); margin:5px 0 0 25px">Detecta el peso visual para que los tags laterales no desvíen el producto.</p>
            </div>
          </div>

          <div class="c6">
            <label>Alineación Vertical</label>
            <select id="vAlign">
              <option value="center">Centro</option>
              <option value="bottom" selected>Abajo (Grilla)</option>
            </select>
          </div>

          <div class="c6"><label>Padding (%)</label><input type="number" id="padding" value="2"></div>
          
          <div class="c12">
            <button id="go" class="btn">PROCESAR LOTE</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <progress id="prog" value="0" max="100" style="width:100%"></progress>
    <div id="log" class="log">Esperando lote...</div>
    <a id="zipDownload" class="btn" style="display:none; margin-top:10px; text-decoration:none; text-align:center">DESCARGAR ZIP</a>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let selectedFiles = [];

  $('tabFiles').onclick = () => { $('paneFiles').style.display='block'; $('paneUrls').style.display='none'; $('tabFiles').className='active'; $('tabUrls').className=''; };
  $('tabUrls').onclick = () => { $('paneUrls').style.display='block'; $('paneFiles').style.display='none'; $('tabUrls').className='active'; $('tabFiles').className=''; };
  $('dropZone').onclick = () => $('localFiles').click();
  $('localFiles').onchange = (e) => { selectedFiles = Array.from(e.target.files); $('fileCount').textContent = `${selectedFiles.length} ARCHIVOS`; };

  function getSmartBounds(img) {
    const canvas = document.createElement('canvas'); canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    
    let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
    let sumX = 0, sumY = 0, count = 0;

    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const i = (y * canvas.width + x) * 4;
        // Píxel es contenido si no es blanco y no es transparente
        if (data[i+3] > 10 && (data[i] < 250 || data[i+1] < 250 || data[i+2] < 250)) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
          sumX += x; sumY += y; count++;
        }
      }
    }
    
    if (count === 0) return {x:0, y:0, w:img.width, h:img.height, cx: img.width/2, cy: img.height/2};

    return {
      x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1,
      cx: sumX / count, // Centro de masa X
      cy: sumY / count  // Centro de masa Y
    };
  }

  $('go').onclick = async () => {
    const tasks = [];
    if ($('paneUrls').style.display === 'none') {
      selectedFiles.forEach(f => tasks.push({ source: f, name: f.name.split('.')[0], type: 'file' }));
    } else {
      const vtexActive = $('vtexNaming').checked;
      $('urls').value.split('\n').filter(u => u.trim()).forEach((u, i) => {
        let name = `img-${i+1}`;
        if (vtexActive && u.includes('/ids/')) {
            const parts = u.split('/ids/');
            if (parts[1]) name = parts[1].split('?')[0].replace(/\//g, '-').replace(/\.[^/.]+$/, "");
        }
        tasks.push({ source: u.trim(), name: name, type: 'url' });
      });
    }

    if (!tasks.length) return;
    $('go').disabled = true; $('zipDownload').style.display = 'none';
    const zip = new JSZip();
    const W = parseInt($('w').value), H = parseInt($('h').value), pad = parseInt($('padding').value)/100;

    for (let i = 0; i < tasks.length; i++) {
      try {
        const t = tasks[i];
        const img = (t.type === 'file') ? await createImageBitmap(t.source) : await createImageBitmap(await (await fetch(t.source)).blob());
        const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H);

        const info = getSmartBounds(img);
        const sW = W * (1 - pad*2), sH = H * (1 - pad*2);
        const scale = Math.min(sW/info.w, sH/info.h);
        
        const dW = info.w * scale, dH = info.h * scale;
        
        // CÁLCULO DE POSICIÓN CON SMART BALANCE
        let dX, dY;
        
        if ($('smartBalance').checked) {
            // Centramos basándonos en el Centro de Masa relativo al bounding box
            const massRelativeX = (info.cx - info.x) * scale;
            dX = (W / 2) - massRelativeX;
        } else {
            dX = (W - dW) / 2;
        }

        if ($('vAlign').value === 'bottom') {
            dY = (H - (H*pad)) - dH;
        } else {
            dY = (H - dH) / 2;
        }

        ctx.drawImage(img, info.x, info.y, info.w, info.h, dX, dY, dW, dH);
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
        zip.file(t.name + ".jpg", blob);
        $('log').textContent = `✔ [${i+1}/${tasks.length}] ${t.name}.jpg`;
      } catch (e) { console.error(e); }
      $('prog').value = ((i+1)/tasks.length)*100;
    }

    const content = await zip.generateAsync({type:"blob"});
    $('zipDownload').href = URL.createObjectURL(content);
    $('zipDownload').download = "pack_ecommerce.zip";
    $('zipDownload').style.display = 'block';
    $('go').disabled = false;
  };
})();
</script>
</body>
</html>
