<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Gastivertidor Pro - Ecomm Grid Master</title>
<style>
  :root { --bg:#0f1220; --card:#171a2b; --muted:#8c91a5; --text:#e8ecff; --accent:#6ae3ff; }
  *{box-sizing:border-box}
  body{margin:0; font-family:system-ui,-apple-system,sans-serif; background:linear-gradient(180deg,#0a0d19,#0f1220); color:var(--text); line-height:1.4}
  .wrap{max-width:1100px; margin:24px auto; padding:0 16px}
  .card{background:#171a2b; border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3)}
  h1{font-size:22px; margin:0 0 15px; display:flex; align-items:center; gap:10px; color: var(--accent)}
  .grid{display:grid; gap:20px; grid-template-columns:1fr}
  @media(min-width:900px){.grid{grid-template-columns:1.2fr .8fr}}
  label{font-size:11px; color:var(--muted); display:block; margin-bottom:5px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px}
  input, select, textarea{width:100%; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,.1); background:#0d1020; color:var(--text); font-size: 14px; transition: border 0.2s}
  input:focus, select:focus{border-color: var(--accent); outline: none}
  .row{display:grid; grid-template-columns:repeat(12,1fr); gap:12px}
  .c6{grid-column:span 6} .c12{grid-column:span 12}
  .seg{display:flex; gap:10px; margin:0 0 15px}
  .seg button{border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,0.03); color:#8c91a5; border-radius:12px; padding:12px; cursor:pointer; flex:1; font-weight: 600}
  .seg button.active{background:var(--accent); color:#061018; border-color:transparent}
  .btn{appearance:none; border:0; background:var(--accent); color:#061018; padding:16px; border-radius:12px; font-weight:800; cursor:pointer; width:100%; text-transform: uppercase; letter-spacing: 1px}
  .btn:disabled{opacity:0.4; cursor: not-allowed}
  .log{height:180px; overflow:auto; background:#0d1020; border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px; font-family: 'JetBrains Mono', monospace; font-size:11px; margin-top:15px; white-space: pre-wrap}
  .drop-zone{border:2px dashed rgba(106, 227, 255, 0.2); border-radius:16px; padding:60px 20px; text-align:center; cursor:pointer; transition: 0.3s}
  .drop-zone:hover{border-color: var(--accent); background: rgba(106, 227, 255, 0.05)}
  .pill{background:rgba(106, 227, 255, 0.1); color:var(--accent); padding:4px 10px; border-radius:6px; font-size:11px; font-weight: 700}
  .opt-box{background:rgba(255,255,255,0.03); padding:15px; border-radius:14px; border:1px solid rgba(255,255,255,0.05)}
  progress{width:100%; height:8px; border-radius:10px; appearance: none}
  progress::-webkit-progress-bar {background: #0d1020; border-radius: 10px;}
  progress::-webkit-progress-value {background: var(--accent); border-radius: 10px;}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Gastivertidor <span class="pill">E-COMMERCE READY</span></h1>
    
    <div class="seg">
      <button id="tabFiles" class="active">Subir Archivos</button>
      <button id="tabUrls">URLs de Imágenes</button>
    </div>

    <div class="grid">
      <div id="paneFiles">
        <div class="drop-zone" id="dropZone">
          <p style="margin:0 0 10px">Arrastrá PNGs o JPGs aquí</p>
          <span id="fileCount" class="pill">0 ARCHIVOS</span>
          <input type="file" id="localFiles" multiple accept="image/*" class="hidden" />
        </div>
      </div>

      <div id="paneUrls" class="hidden">
        <label>Listado de URLs</label>
        <textarea id="urls" style="height:155px" placeholder="https://ejemplo.com/foto1.jpg..."></textarea>
      </div>

      <div>
        <div class="row">
          <div class="c6"><label>Ancho (PX)</label><input type="number" id="w" value="1024"></div>
          <div class="c6"><label>Alto (PX)</label><input type="number" id="h" value="1024"></div>
          
          <div class="c12">
            <div class="opt-box">
              <label style="display:flex; align-items:center; gap:8px; color:var(--accent); cursor:pointer; margin:0">
                <input type="checkbox" id="doTrim" checked> 
                <strong>AUTO-TRIM INTELIGENTE (FONDO BLANCO/TRANS)</strong>
              </label>
            </div>
          </div>

          <div class="c6">
            <label>Alineación Vertical</label>
            <select id="vAlign">
              <option value="center">Centrado (PDP)</option>
              <option value="bottom" selected>Abajo / Al piso (PLP Grilla)</option>
              <option value="top">Arriba</option>
            </select>
          </div>

          <div class="c6">
            <label>Padding de Seguridad (%)</label>
            <input type="number" id="padding" value="0" min="0" max="40">
          </div>
          
          <div class="c12">
            <label>Formato de Salida</label>
            <select id="format">
              <option value="image/png">PNG (Mantiene Transparencia)</option>
              <option value="image/jpeg">JPG (Fondo Blanco Sólido)</option>
            </select>
          </div>
          
          <div class="c12" style="margin-top:10px">
            <button id="go" class="btn">PROCESAR PARA E-COMMERCE</button>
            <p id="methodHint" style="font-size:10px; color:var(--muted); text-align:center; margin-top:10px"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <progress id="prog" value="0" max="100"></progress>
    <div id="log" class="log">Esperando acción...</div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let selectedFiles = [];

  const hasFS = (typeof window.showDirectoryPicker === 'function');
  $('methodHint').textContent = hasFS ? "SE GUARDARÁ DIRECTO EN CARPETA" : "SE DESCARGARÁN ARCHIVOS SUELTOS (NO SOPORTA CARPETAS)";

  $('tabFiles').onclick = () => { $('paneFiles').className=''; $('paneUrls').className='hidden'; $('tabFiles').className='active'; $('tabUrls').className=''; };
  $('tabUrls').onclick = () => { $('paneUrls').className=''; $('paneFiles').className='hidden'; $('tabUrls').className='active'; $('tabFiles').className=''; };
  $('dropZone').onclick = () => $('localFiles').click();
  $('localFiles').onchange = (e) => {
    selectedFiles = Array.from(e.target.files);
    $('fileCount').textContent = `${selectedFiles.length} ARCHIVOS CARGADOS`;
  };

  function getTrimBounds(img) {
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;

    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const i = (y * canvas.width + x) * 4;
        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
        // Contenido = No transparente Y no blanco puro
        if (a > 5 && (r < 252 || g < 252 || b < 252)) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    return (maxX < minX) ? {x:0, y:0, w:img.width, h:img.height} : {x:minX, y:minY, w:maxX-minX+1, h:maxY-minY+1};
  }

  $('go').onclick = async () => {
    const tasks = [];
    if ($('paneUrls').classList.contains('hidden')) {
      selectedFiles.forEach(f => tasks.push({ source: f, name: f.name.split('.')[0], type: 'file' }));
    } else {
      $('urls').value.split('\n').filter(u => u.trim()).forEach((u, i) => tasks.push({ source: u.trim(), name: `prod-${i+1}`, type: 'url' }));
    }

    if (!tasks.length) return alert("Cargá archivos o URLs, master.");

    let dirHandle = null;
    if (hasFS) {
      try { dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' }); } catch(e) { return; }
    }

    $('go').disabled = true;
    $('log').textContent = "Iniciando motor de render...";
    const W = parseInt($('w').value), H = parseInt($('h').value), format = $('format').value, ext = format === 'image/png' ? '.png' : '.jpg';
    const pad = parseInt($('padding').value) / 100, vAlign = $('vAlign').value;

    for (let i = 0; i < tasks.length; i++) {
      try {
        const t = tasks[i];
        const img = (t.type === 'file') ? await createImageBitmap(t.source) : await createImageBitmap(await (await fetch(t.source)).blob());
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');

        // Color de fondo para JPG
        if (format === 'image/jpeg') { ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H); }

        const src = $('doTrim').checked ? getTrimBounds(img) : {x:0, y:0, w:img.width, h:img.height};
        
        // Área útil restando el padding
        const safeW = W * (1 - pad * 2);
        const safeH = H * (1 - pad * 2);
        
        const scale = Math.min(safeW/src.w, safeH/src.h);
        const dW = src.w * scale;
        const dH = src.h * scale;

        const dX = (W - dW) / 2;
        let dY = (H - dH) / 2; // Default: Center (PDP)

        if (vAlign === 'bottom') {
          // Calculamos el piso restando el padding inferior
          dY = (H - (H * pad)) - dH;
        } else if (vAlign === 'top') {
          dY = H * pad;
        }

        ctx.drawImage(img, src.x, src.y, src.w, src.h, dX, dY, dW, dH);
        const blob = await new Promise(r => canvas.toBlob(r, format, 0.92));

        if (dirHandle) {
          const fileHandle = await dirHandle.getFileHandle(t.name + ext, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(blob); await writable.close();
        } else {
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = t.name + ext; a.click();
          await new Promise(r => setTimeout(r, 250));
        }
        $('log').textContent = `[${i+1}/${tasks.length}] ✔ ${t.name}${ext} procesada.`;
      } catch (e) { $('log').textContent += `\n❌ Error en: ${tasks[i].name}`; }
      $('prog').value = ((i + 1) / tasks.length) * 100;
    }
    $('go').disabled = false;
    $('log').textContent += `\n\nFINALIZADO. ¡Tus imágenes están listas!`;
  };
})();
</script>
</body>
</html>
