<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gastivertidor Pro - JPG & PNG Trim</title>
<style>
  :root { --bg:#0f1220; --card:#171a2b; --muted:#8c91a5; --text:#e8ecff; --accent:#6ae3ff; }
  *{box-sizing:border-box}
  body{margin:0; font-family:system-ui,sans-serif; background:linear-gradient(180deg,#0a0d19,#0f1220); color:var(--text)}
  .wrap{max-width:1100px; margin:24px auto; padding:0 16px}
  .card{background:#171a2b; border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:18px}
  h1{font-size:20px; margin:0 0 10px; display:flex; align-items:center; gap:10px}
  .grid{display:grid; gap:14px; grid-template-columns:1fr}
  @media(min-width:900px){.grid{grid-template-columns:1.2fr .8fr}}
  label{font-size:13px; color:var(--muted); display:block; margin-bottom:4px}
  input[type="number"],select{width:100%; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.08); background:#0d1020; color:var(--text)}
  .row{display:grid; grid-template-columns:repeat(12,1fr); gap:10px}
  .c6{grid-column:span 6} .c12{grid-column:span 12}
  .seg{display:flex; gap:8px; margin:8px 0 12px}
  .seg button{border:1px solid rgba(255,255,255,.12); background:#0d1020; color:#8c91a5; border-radius:10px; padding:8px; cursor:pointer; flex:1}
  .seg button.active{background:var(--accent); color:#061018; font-weight:700}
  .btn{appearance:none; border:0; background:var(--accent); color:#061018; padding:14px; border-radius:12px; font-weight:700; cursor:pointer; width:100%}
  .btn:disabled{opacity:0.4; cursor:not-allowed}
  .log{height:180px; overflow:auto; background:#0d1020; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:10px; font-family:monospace; font-size:11px; margin-top:10px}
  .drop-zone{border:2px dashed rgba(255,255,255,0.1); border-radius:12px; padding:40px; text-align:center; cursor:pointer}
  .pill{background:rgba(106, 227, 255, 0.1); color:var(--accent); padding:2px 8px; border-radius:4px; font-size:11px}
  .opt-box{background:rgba(255,255,255,0.03); padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.05)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Gastivertidor <span class="pill">JPG & PNG Hybrid Trim</span></h1>
    
    <div class="seg">
      <button id="tabFiles" class="active">Subir Archivos</button>
      <button id="tabUrls">Por URLs</button>
    </div>

    <div class="grid">
      <div id="paneFiles">
        <div class="drop-zone" id="dropZone">
          <p>Soltá tus <b>PNGs</b> o <b>JPGs con fondo blanco</b> acá</p>
          <span id="fileCount" style="color:var(--muted)">0 archivos listos</span>
          <input type="file" id="localFiles" multiple accept="image/png,image/jpeg,image/webp" style="display:none" />
        </div>
      </div>

      <div id="paneUrls" style="display:none">
        <textarea id="urls" style="width:100%; height:120px; background:#0d1020; color:#fff; border-radius:10px; padding:10px" placeholder="Links de imágenes..."></textarea>
      </div>

      <div>
        <div class="row">
          <div class="c6"><label>Ancho</label><input type="number" id="w" value="1024"></div>
          <div class="c6"><label>Alto</label><input type="number" id="h" value="1024"></div>
          
          <div class="c12">
            <div class="opt-box">
              <label style="display:flex; align-items:center; gap:8px; color:var(--accent); cursor:pointer">
                <input type="checkbox" id="doTrim" checked> 
                <strong>Auto-Trim Inteligente</strong>
              </label>
              <p style="font-size:11px; margin:5px 0 0 20px; color:var(--muted)">Elimina fondos transparentes O blancos automáticamente.</p>
            </div>
          </div>

          <div class="c6">
            <label>Ajuste</label>
            <select id="mode">
              <option value="contain" selected>Contain (Todo adentro)</option>
              <option value="cover">Cover (Zoom Llenar)</option>
            </select>
          </div>

          <div class="c6">
            <label>Margen interno (%)</label>
            <input type="number" id="padding" value="5" min="0" max="40">
          </div>
          
          <div class="c12">
            <label>Exportar como</label>
            <select id="format">
              <option value="image/png">PNG (Mantiene transparencia)</option>
              <option value="image/jpeg">JPG (Fondo Blanco sólido)</option>
            </select>
          </div>
          
          <div class="c12" style="margin-top:10px">
            <button id="go" class="btn">PROCESAR Y GUARDAR</button>
            <p id="methodHint" class="hint" style="margin-top:8px; text-align:center"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <progress id="prog" value="0" max="100" style="width:100%"></progress>
    <div id="log" class="log">Listo para procesar JPG/PNG.</div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let selectedFiles = [];

  const hasFS = 'showDirectoryPicker' in window;
  $('methodHint').textContent = hasFS ? "Guardado directo en carpeta habilitado." : "Descarga automática de archivos individuales.";

  $('tabFiles').onclick = () => { $('paneFiles').style.display='block'; $('paneUrls').style.display='none'; $('tabFiles').className='active'; $('tabUrls').className=''; };
  $('tabUrls').onclick = () => { $('paneUrls').style.display='block'; $('paneFiles').style.display='none'; $('tabUrls').className='active'; $('tabFiles').className=''; };
  $('dropZone').onclick = () => $('localFiles').click();
  
  $('localFiles').onchange = (e) => {
    selectedFiles = Array.from(e.target.files);
    $('fileCount').textContent = `${selectedFiles.length} archivos cargados`;
  };

  // --- LÓGICA DE TRIM HÍBRIDA (Alpha + Color) ---
  function getTrimBounds(img) {
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = pixels.data;
    
    let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;

    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const i = (y * canvas.width + x) * 4;
        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];

        // Se considera "contenido" si:
        // 1. No es transparente (a > 0)
        // 2. Y no es "casi blanco" (al menos uno de los canales RGB es menor a 245)
        const isTransparent = a === 0;
        const isWhite = r > 245 && g > 245 && b > 245;

        if (!isTransparent && !isWhite) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    return (maxX < minX) ? {x:0, y:0, w:img.width, h:img.height} : {x:minX, y:minY, w:maxX-minX+1, h:maxY-minY+1};
  }

  $('go').onclick = async () => {
    const tasks = [];
    const isUrlMode = document.getElementById('paneUrls').style.display !== 'none';
    
    if (!isUrlMode) {
      selectedFiles.forEach(f => tasks.push({ source: f, type: 'file' }));
    } else {
      $('urls').value.split('\n').filter(u => u.trim()).forEach((u, i) => tasks.push({ source: u.trim(), name: `img-${i}`, type: 'url' }));
    }

    if (!tasks.length) return alert("Subí los archivos primero.");

    let dirHandle = null;
    if (hasFS) {
      try { dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' }); } 
      catch (e) { return; }
    }

    $('go').disabled = true;
    const W = parseInt($('w').value), H = parseInt($('h').value), padPercent = parseInt($('padding').value) / 100;
    const format = $('format').value;
    const ext = format === 'image/png' ? '.png' : '.jpg';
    
    const innerW = W * (1 - padPercent * 2), innerH = H * (1 - padPercent * 2);

    for (let i = 0; i < tasks.length; i++) {
      const t = tasks[i];
      try {
        let img = (t.type === 'file') ? await createImageBitmap(t.source) : await createImageBitmap(await (await fetch(t.source)).blob());
        const fileName = (t.type === 'file' ? t.source.name.split('.')[0] : t.name) + ext;

        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');

        // Fondo blanco si exportamos a JPG
        if (format === 'image/jpeg') {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0,0,W,H);
        }

        let src = $('doTrim').checked ? getTrimBounds(img) : {x:0, y:0, w:img.width, h:img.height};
        const scale = ($('mode').value === 'cover') ? Math.max(innerW/src.w, innerH/src.h) : Math.min(innerW/src.w, innerH/src.h);
        const dW = src.w * scale, dH = src.h * scale;
        
        ctx.drawImage(img, src.x, src.y, src.w, src.h, (W-dW)/2, (H-dH)/2, dW, dH);
        const blob = await new Promise(r => canvas.toBlob(r, format, 0.90));

        if (dirHandle) {
          const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(blob);
          await writable.close();
        } else {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = fileName;
          a.click();
          await new Promise(r => setTimeout(r, 250));
        }
        $('log').textContent = `✔ Procesado ${i+1}/${tasks.length}: ${fileName}`;
      } catch (e) {
        $('log').textContent += `\n❌ Error: ${t.source?.name || 'URL'}`;
      }
      $('prog').value = ((i + 1) / tasks.length) * 100;
    }
    $('go').disabled = false;
    $('log').textContent += `\n\n¡LISTO! Revisá tu carpeta.`;
  };
})();
</script>
</body>
</html>
