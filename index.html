<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gastivertidor Pro - Transparencia PNG</title>
<style>
  :root { --bg:#0f1220; --card:#171a2b; --muted:#8c91a5; --text:#e8ecff; --accent:#6ae3ff; }
  *{box-sizing:border-box}
  body{margin:0; font-family:system-ui,Segoe UI,Roboto,Inter,Arial; background:linear-gradient(180deg,#0a0d19,#0f1220); color:var(--text)}
  .wrap{max-width:1100px; margin:24px auto; padding:0 16px}
  .card{background:#171a2b; border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:18px}
  h1{font-size:20px; margin:0 0 10px}
  .grid{display:grid; gap:14px; grid-template-columns:1fr}
  @media(min-width:900px){.grid{grid-template-columns:1.2fr .8fr}}
  label{font-size:13px; color:var(--muted)}
  textarea{width:100%; min-height:150px; background:#0d1020; border:1px solid rgba(255,255,255,.08); color:var(--text); border-radius:12px; padding:12px; resize:vertical}
  input[type="text"],input[type="number"],select{width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.08); background:#0d1020; color:var(--text)}
  .row{display:grid; grid-template-columns:repeat(12,1fr); gap:10px}
  .c12{grid-column:span 12}.c6{grid-column:span 6}
  .seg{display:flex; gap:8px; margin:8px 0 12px}
  .seg button{border:1px solid rgba(255,255,255,.12); background:#0d1020; color:#8c91a5; border-radius:10px; padding:8px 10px; cursor:pointer; flex:1}
  .seg button.active{background:var(--accent); color:#061018; border-color:transparent; font-weight:700}
  .btn{appearance:none; border:0; background:var(--accent); color:#061018; padding:12px 14px; border-radius:12px; font-weight:700; cursor:pointer; width:100%}
  .btn.secondary{background:#2a2e42; color:#e8ecff; border:1px solid rgba(255,255,255,.08)}
  .hint{font-size:12px; color:#8c91a5}
  .log{height:200px; overflow:auto; background:#0d1020; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:10px; font-family:ui-monospace,monospace; font-size:11px}
  progress{width:100%; height:10px; border-radius:5px}
  .drop-zone{border:2px dashed rgba(255,255,255,0.1); border-radius:12px; padding:40px; text-align:center; cursor:pointer; transition:0.2s}
  .drop-zone:hover{background:rgba(255,255,255,0.03); border-color:var(--accent)}
  .pill{background:rgba(106, 227, 255, 0.1); color:var(--accent); padding:2px 8px; border-radius:4px; font-size:11px}
  .hidden{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Recortador Masivo <span class="pill">PNG Transparent Support</span></h1>
    
    <div class="seg" role="tablist">
      <button id="tabFiles" class="active">Subir Archivos</button>
      <button id="tabUrls">URLs</button>
    </div>

    <div class="grid">
      <div id="paneFiles">
        <div class="drop-zone" id="dropZone">
          <p>Soltá tus PNGs acá o hacé clic</p>
          <span id="fileCount" class="hint">0 seleccionados</span>
          <input type="file" id="localFiles" multiple accept="image/*" class="hidden" />
        </div>
      </div>

      <div id="paneUrls" class="hidden">
        <label>URLs (una por línea)</label>
        <textarea id="urls" placeholder="https://ejemplo.com/imagen.png"></textarea>
      </div>

      <div>
        <div class="row">
          <div class="c6">
            <label>Ancho (px)</label>
            <input type="number" id="w" value="500">
          </div>
          <div class="c6">
            <label>Alto (px)</label>
            <input type="number" id="h" value="375">
          </div>
          <div class="c6">
            <label>Ajuste</label>
            <select id="mode">
              <option value="cover">Cortar (Cover)</option>
              <option value="contain" selected>Bandas (Contain)</option>
              <option value="stretch">Estirar</option>
            </select>
          </div>
          <div class="c6">
            <label>Exportar como</label>
            <select id="format">
              <option value="image/png">PNG (Transparente)</option>
              <option value="image/jpeg">JPG (Fondo Blanco)</option>
            </select>
          </div>
          <div class="c12" style="margin-top:10px">
            <button id="go" class="btn">Procesar y Descargar ZIP</button>
            <button id="cancel" class="btn secondary" disabled style="margin-top:8px">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <progress id="prog" value="0" max="100"></progress>
    <div id="log" class="log" style="margin-top:10px">Esperando archivos...</div>
    <div style="margin-top:10px">
        <a id="downloadZip" class="btn hidden" style="text-align:center; text-decoration:none">Descargar ZIP Listo</a>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const localFiles = $('localFiles'), dropZone = $('dropZone'), fileCount = $('fileCount');
  const log = $('log'), prog = $('prog'), download = $('downloadZip'), go = $('go');
  
  let selectedFiles = [];
  let abort = false;

  // Tabs
  $('tabFiles').onclick = () => { $('paneFiles').classList.remove('hidden'); $('paneUrls').classList.add('hidden'); $('tabFiles').classList.add('active'); $('tabUrls').classList.remove('active'); };
  $('tabUrls').onclick = () => { $('paneUrls').classList.remove('hidden'); $('paneFiles').classList.add('hidden'); $('tabUrls').classList.add('active'); $('tabFiles').classList.remove('active'); };

  // Selección de archivos
  dropZone.onclick = () => localFiles.click();
  localFiles.onchange = (e) => {
    selectedFiles = Array.from(e.target.files);
    fileCount.textContent = `${selectedFiles.length} archivos cargados`;
    log.textContent = `Listos para procesar ${selectedFiles.length} archivos.`;
  };

  function addLog(msg) {
    log.textContent += `\n> ${msg}`;
    log.scrollTop = log.scrollHeight;
  }

  // Lógica de Canvas con Transparencia
  function processImage(img, tw, th, fitMode, format) {
    const canvas = document.createElement('canvas');
    canvas.width = tw; canvas.height = th;
    const ctx = canvas.getContext('2d');

    // SI ES JPG, pintamos fondo blanco. SI ES PNG, dejamos transparente.
    if(format === 'image/jpeg') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,tw,th);
    }

    const sw = img.width, sh = img.height;
    let dx = 0, dy = 0, dw = tw, dh = th;

    if(fitMode === 'cover'){
        const scale = Math.max(tw/sw, th/sh);
        dw = sw * scale; dh = sh * scale;
        dx = (tw - dw) / 2; dy = (th - dh) / 2;
    } else if(fitMode === 'contain'){
        const scale = Math.min(tw/sw, th/sh);
        dw = sw * scale; dh = sh * scale;
        dx = (tw - dw) / 2; dy = (th - dh) / 2;
    }

    ctx.drawImage(img, dx, dy, dw, dh);
    return canvas;
  }

  go.onclick = async () => {
    abort = false;
    const tasks = [];
    const W = parseInt($('w').value), H = parseInt($('h').value);
    const mode = $('mode').value;
    const format = $('format').value;
    const ext = format === 'image/png' ? '.png' : '.jpg';

    // Recolectar de Archivos o URLs
    if (!$('paneFiles').classList.contains('hidden')) {
        selectedFiles.forEach(f => tasks.push({ source: f, name: f.name.split('.')[0] + ext, type: 'file' }));
    } else {
        $('urls').value.split('\n').filter(l => l.trim()).forEach((u, i) => tasks.push({ source: u.trim(), name: `img-${i}${ext}`, type: 'url' }));
    }

    if(!tasks.length) return alert("Subí archivos o pegá URLs");

    go.disabled = true; $('cancel').disabled = false;
    log.textContent = "Iniciando proceso...";
    const zip = new JSZip();

    for(let i=0; i < tasks.length; i++) {
        if(abort) break;
        const t = tasks[i];
        try {
            let imgElement;
            if(t.type === 'file') {
                imgElement = await createImageBitmap(t.source);
            } else {
                const res = await fetch(t.source);
                const blob = await res.blob();
                imgElement = await createImageBitmap(blob);
            }

            const canvas = processImage(imgElement, W, H, mode, format);
            const blob = await new Promise(res => canvas.toBlob(res, format, 0.92));
            zip.file(t.name, blob);
            addLog(`OK: ${t.name}`);
        } catch(e) {
            addLog(`ERROR en ${t.name}`);
        }
        prog.value = ((i+1) / tasks.length) * 100;
    }

    const content = await zip.generateAsync({type:"blob"});
    download.href = URL.createObjectURL(content);
    download.download = "imagenes_procesadas.zip";
    download.classList.remove('hidden');
    go.disabled = false; $('cancel').disabled = true;
    addLog("ZIP Generado con éxito.");
  };

  $('cancel').onclick = () => abort = true;

})();
</script>
</body>
</html>
