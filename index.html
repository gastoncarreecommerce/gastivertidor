<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gastivertidor Pro - Auto Trim Edition</title>
<style>
  :root { --bg:#0f1220; --card:#171a2b; --muted:#8c91a5; --text:#e8ecff; --accent:#6ae3ff; }
  *{box-sizing:border-box}
  body{margin:0; font-family:system-ui,sans-serif; background:linear-gradient(180deg,#0a0d19,#0f1220); color:var(--text)}
  .wrap{max-width:1100px; margin:24px auto; padding:0 16px}
  .card{background:#171a2b; border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:18px}
  h1{font-size:20px; margin:0 0 10px; display:flex; align-items:center; gap:10px}
  .grid{display:grid; gap:14px; grid-template-columns:1fr}
  @media(min-width:900px){.grid{grid-template-columns:1.2fr .8fr}}
  label{font-size:13px; color:var(--muted); display:block; margin-bottom:4px}
  input[type="number"],select{width:100%; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.08); background:#0d1020; color:var(--text)}
  .row{display:grid; grid-template-columns:repeat(12,1fr); gap:10px}
  .c6{grid-column:span 6} .c12{grid-column:span 12}
  .seg{display:flex; gap:8px; margin:8px 0 12px}
  .seg button{border:1px solid rgba(255,255,255,.12); background:#0d1020; color:#8c91a5; border-radius:10px; padding:8px; cursor:pointer; flex:1}
  .seg button.active{background:var(--accent); color:#061018; font-weight:700}
  .btn{appearance:none; border:0; background:var(--accent); color:#061018; padding:14px; border-radius:12px; font-weight:700; cursor:pointer; width:100%}
  .btn.secondary{background:#2a2e42; color:#e8ecff; border:1px solid rgba(255,255,255,.08)}
  .log{height:180px; overflow:auto; background:#0d1020; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:10px; font-family:monospace; font-size:11px; margin-top:10px}
  .drop-zone{border:2px dashed rgba(255,255,255,0.1); border-radius:12px; padding:40px; text-align:center; cursor:pointer}
  .pill{background:rgba(106, 227, 255, 0.1); color:var(--accent); padding:2px 8px; border-radius:4px; font-size:11px}
  .hidden{display:none}
  .opt-box{background:rgba(255,255,255,0.03); padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.05)}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Gastivertidor <span class="pill">Auto-Crop Alpha</span></h1>
    
    <div class="seg">
      <button id="tabFiles" class="active">Subir PNGs</button>
      <button id="tabUrls">Por URLs</button>
    </div>

    <div class="grid">
      <div id="paneFiles">
        <div class="drop-zone" id="dropZone">
          <p>Soltá tus imágenes con transparencia acá</p>
          <span id="fileCount" style="color:var(--muted)">0 archivos</span>
          <input type="file" id="localFiles" multiple accept="image/png,image/webp" class="hidden" />
        </div>
      </div>

      <div id="paneUrls" class="hidden">
        <textarea id="urls" style="width:100%; height:120px; background:#0d1020; color:#fff; border-radius:10px; padding:10px" placeholder="Links de PNGs..."></textarea>
      </div>

      <div>
        <div class="row">
          <div class="c6"><label>Ancho</label><input type="number" id="w" value="1024"></div>
          <div class="c6"><label>Alto</label><input type="number" id="h" value="1024"></div>
          
          <div class="c12">
            <div class="opt-box">
              <label style="display:flex; align-items:center; gap:8px; color:var(--accent); cursor:pointer">
                <input type="checkbox" id="doTrim" checked> 
                <strong>Eliminar espacios transparentes (Trim)</strong>
              </label>
              <p style="font-size:11px; margin:5px 0 0 20px; color:var(--muted)">Elimina el aire alrededor del objeto antes de escalar.</p>
            </div>
          </div>

          <div class="c12">
            <label>Modo de ajuste</label>
            <select id="mode">
              <option value="contain" selected>Ajustar todo adentro (Contain)</option>
              <option value="cover">Llenar todo el cuadrado (Cover)</option>
            </select>
          </div>
          
          <div class="c12">
            <button id="go" class="btn">PROCESAR Y LIMPIAR BORDES</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <progress id="prog" value="0" max="100" style="width:100%"></progress>
    <div id="log" class="log">Esperando archivos...</div>
    <a id="downloadZip" class="btn hidden" style="margin-top:10px; text-decoration:none; text-align:center">DESCARGAR ZIP</a>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let selectedFiles = [];

  // Tabs
  $('tabFiles').onclick = () => { $('paneFiles').className=''; $('paneUrls').className='hidden'; $('tabFiles').className='active'; $('tabUrls').className=''; };
  $('tabUrls').onclick = () => { $('paneUrls').className=''; $('paneFiles').className='hidden'; $('tabUrls').className='active'; $('tabFiles').className=''; };

  $('dropZone').onclick = () => $('localFiles').click();
  $('localFiles').onchange = (e) => {
    selectedFiles = Array.from(e.target.files);
    $('fileCount').textContent = `${selectedFiles.length} archivos cargados`;
  };

  // --- FUNCIÓN MÁGICA: Obtener límites del contenido real (Trim) ---
  function getTrimBounds(img) {
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    
    const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = pixels.data;
    let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;

    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const alpha = data[(y * canvas.width + x) * 4 + 3];
        if (alpha > 0) { // Si el píxel no es transparente
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    
    // Si la imagen está vacía, devolvemos tamaño original
    if (maxX < minX) return { x:0, y:0, w:img.width, h:img.height };
    
    return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
  }

  $('go').onclick = async () => {
    const W = parseInt($('w').value), H = parseInt($('h').value);
    const doTrim = $('doTrim').checked;
    const mode = $('mode').value;
    const tasks = [];

    if (!$('paneFiles').classList.contains('hidden')) {
      selectedFiles.forEach(f => tasks.push({ source: f, name: f.name, type: 'file' }));
    } else {
      $('urls').value.split('\n').filter(u => u.trim()).forEach((u, i) => tasks.push({ source: u.trim(), name: `img-${i}.png`, type: 'url' }));
    }

    if (!tasks.length) return alert("Subí algo primero");

    $('log').textContent = "Iniciando proceso de limpieza...";
    $('go').disabled = true;
    const zip = new JSZip();

    for (let i = 0; i < tasks.length; i++) {
      const t = tasks[i];
      try {
        let img;
        if(t.type === 'file') {
          img = await createImageBitmap(t.source);
        } else {
          const res = await fetch(t.source);
          img = await createImageBitmap(await res.blob());
        }

        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');

        // 1. Decidir qué parte de la imagen original usamos
        let sourceArea = { x: 0, y: 0, w: img.width, h: img.height };
        if (doTrim) {
          sourceArea = getTrimBounds(img);
        }

        // 2. Calcular escala para el canvas final (1024x1024)
        const scale = (mode === 'cover') 
          ? Math.max(W / sourceArea.w, H / sourceArea.h)
          : Math.min(W / sourceArea.w, H / sourceArea.h);

        const drawW = sourceArea.w * scale;
        const drawH = sourceArea.h * scale;
        const drawX = (W - drawW) / 2;
        const drawY = (H - drawH) / 2;

        // 3. Dibujar SOLO la parte con contenido
        ctx.drawImage(img, sourceArea.x, sourceArea.y, sourceArea.w, sourceArea.h, drawX, drawY, drawW, drawH);

        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        zip.file(t.name.split('.')[0] + ".png", blob);
        $('log').textContent += `\n✔ Procesado: ${t.name}`;
      } catch (e) {
        $('log').textContent += `\n❌ Error en: ${t.name}`;
      }
      $('prog').value = ((i + 1) / tasks.length) * 100;
    }

    const content = await zip.generateAsync({type:"blob"});
    $('downloadZip').href = URL.createObjectURL(content);
    $('downloadZip').download = "gastivertidor_recortado.zip";
    $('downloadZip').classList.remove('hidden');
    $('go').disabled = false;
    $('log').textContent += `\n\n¡TERMINADO!`;
  };
})();
</script>
</body>
</html>
